---
# Auto-assigns reviewers and PR author when PRs are opened or ready for review.
# Uses auto-assign-action and assign-author.
# Details: https://qiita.com/yusuke-sasaki/items/94a8f64e837966266bfb
name: 'Auto Assign'
on:
  pull_request:
    types: [opened, ready_for_review]
jobs:
  add-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Assignees and Reviewers to PR
        # このアクションは移動タグを打たないため、@v2 のような浮動参照は
        # 解決できず、ジョブは起動時に `Unable to resolve action` で落ちる。
        # 必ず正確なバージョンタグで参照すること。
        # 学生リポジトリには Renovate も Dependabot も無いので、ここが
        # 自動で上がることはなく、更新はこのテンプレートを直して配り直す。
        uses: kentaro-m/auto-assign-action@v2.0.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/auto_assign_myteams.yml"
      - name: Assign author to PR
        uses: technote-space/assign-author@v1
