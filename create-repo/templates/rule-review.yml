---
# Rule Review: the supervisor's draft review of the changed .tex files.
# This job only asks the supervisor's private runner to review the PR; it sends
# the repository name and the PR number, and nothing else. The review runs and
# is stored where students cannot read it, and the supervisor sends it from
# there after checking it. Installed only for repositories that can read the
# private __RULE_REVIEW_ACTION__ action; the owner check keeps a copied or
# transferred repository from failing on every PR.
name: Rule Review

on:
  pull_request:
    # No synchronize: each draft is its own PR, reviewed once when it opens.
    types: [opened, reopened, ready_for_review]

concurrency:
  group: rule-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository_owner == '__RULE_REVIEW_OWNER__' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: __RULE_REVIEW_ACTION__@v2
        with:
          client_id: ${{ vars.RULE_REVIEW_APP_CLIENT_ID }}
          private_key: ${{ secrets.RULE_REVIEW_APP_KEY }}
