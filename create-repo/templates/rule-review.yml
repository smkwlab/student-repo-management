---
# Rule Review: the supervisor's draft review of the changed .tex files.
# Posts nothing to the PR; the comments go to an Actions artifact, and the
# supervisor turns them into a pending review with pending_review.py from
# __RULE_REVIEW_ACTION__. Installed only for repositories that can read that
# private action; the owner check keeps a copied or transferred repository from
# failing on every PR.
name: Rule Review

on:
  pull_request:
    # No synchronize: each draft is its own PR, and a run costs about USD 1.5-2.5
    # per changed .tex file. Re-run the job from the Actions tab to review again.
    types: [opened, reopened, ready_for_review]

concurrency:
  group: rule-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository_owner == '__RULE_REVIEW_OWNER__' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: __RULE_REVIEW_ACTION__@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
